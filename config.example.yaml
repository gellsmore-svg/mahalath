mongo:
  uri: mongodb://localhost:27017
  # Distinct from Tirzah's database; same Mongo instance is fine.
  # See ADR-017.
  database: mahalath_dev

paths:
  # Operator drops new documents into input/. The ingestion worker
  # moves accepted files to processed/. See ADR-011, ADR-012.
  input: input
  processed: processed
  ontology: ontology
  logs: logs
  undecided: undecided

runtime:
  # Model adapter and model name. Initial runtime is Ollama; see ADR-005.
  # llama-cpp-python remains an optional future path.
  model_adapter: ollama_cli
  # gemma4:e2b chosen as Stage 1 default after a 2026-06-06 comparison
  # against gemma3:1b: 4.8x faster end-to-end (24s vs 1m58s on the
  # agonist-intro smoke), 1 iteration to acceptance vs 22-23, and
  # noticeably more domain-specific definitions. 7.2 GB on disk.
  model: gemma4:e2b

  # Multi-agent debate roles. Names per requirements §3.2 and DQ-001.
  # Moderator default off until first iteration cap is hit or first
  # contested split is detected. See DQ-001.
  # Each role may pin its own model (DQ-010): putting the debaters on
  # different model families makes min(pc, se) genuinely cross-model.
  # model: null -> the role uses runtime.model.
  agents:
    precision_critic:
      enabled: true
      system_prompt_path: null   # uses built-in default when null
      model: null                # e.g. mistral-small
    synthesis_explorer:
      enabled: true
      system_prompt_path: null
      model: null
    moderator:
      enabled: false
      system_prompt_path: null

  # Debate loop controls. Defaults per ADR-009 (iteration cap) and
  # ADR-010 (confidence threshold).
  # Consensus passes (hierarchy review + intent attribution) may
  # rotate across a model roster: pass i runs on consensus_models[i %
  # len]. Unanimity across model FAMILIES is much stronger evidence
  # than one model agreeing with itself N times. null -> every pass on
  # runtime.model.
  # consensus_models:
  #   - gemma4:e2b
  #   - mistral-small
  #   - qwen3.5:35b

  max_iterations_per_term: 50
  confidence_threshold: 8.0
  confidence_scale_max: 10.0

  # Resolved from PATH by default (portable). The HTTP path (ollama_base_url)
  # is preferred; only the `ollama_cli` adapter shells out to this binary.
  # Override for a non-PATH install, e.g. a WSL-mounted Windows binary:
  #   ollama_executable: /mnt/c/Users/<you>/AppData/Local/Programs/Ollama/ollama.exe
  # or set the OLLAMA_EXECUTABLE env var (Noa renders this from .env).
  ollama_executable: ollama
  # localhost for native installs. Under WSL2, embeddings need the
  # Windows host over HTTP — use the `wsl-gateway` sentinel host, which
  # auto-resolves to the WSL2 default gateway at startup (survives WSL
  # restarts) and requires OLLAMA_HOST=0.0.0.0 on the Windows side:
  #   ollama_base_url: http://wsl-gateway:11434
  ollama_base_url: http://localhost:11434
  # Generous: the first call after idle loads the model from disk,
  # which takes minutes on laptop hardware.
  ollama_timeout_seconds: 600

  # Cross-language candidate shortlisting (M-C). The embedding model
  # turns a definition's meaning into a vector so candidate pairs are
  # found by meaning-closeness instead of a model eyeballing a list.
  # MUST be multilingual (bge-m3 covers 100+ languages incl. CJK).
  # Run `mahalath backfill-embeddings --apply` once it's pulled, then
  # `generate-mappings --candidate-source embedding`.
  embedding_model: bge-m3
  # embedding_adapter: null        # null -> use model_adapter
  mapping_candidate_source: auto   # auto | embedding | prompt
  mapping_candidate_top_k: 5

  # Route LLM calls (generation AND embeddings/fingerprinting) through a
  # Hoglah queue daemon instead of calling Ollama directly. Set
  # model_adapter / embedding_adapter / chat_adapter to "hoglah" to use it,
  # and install the extra:  pip install 'mahalath[hoglah]'.
  #
  # Topology: a SEPARATE `hoglah run` worker daemon executes jobs off the
  # shared SQLite queue (db_path) and writes results to output_dir. Mahalath
  # is a pure submitter — it enqueues, then either polls output_dir or gets an
  # HTTP callback. Point the daemon at the SAME db_path and output_dir, e.g.:
  #   HOGLAH_OUTPUT_DIR=~/.hoglah/outbox hoglah run --real
  hoglah:
    db_path: ~/.hoglah/hoglah.db
    output_dir: ~/.hoglah/outbox
    # How results come back: "poll" the output folder, or "callback" (Mahalath
    # runs a tiny HTTP receiver and Hoglah POSTs the result to it; falls back
    # to the output folder if a push is missed).
    delivery: callback
    poll_interval_seconds: 0.5
    # Callback receiver bind/advertise host + port (delivery: callback).
    # Both processes are local, so 127.0.0.1 works. port 0 = OS picks a free
    # port. Hoglah is given this URL per job; nothing is hardcoded on its side.
    callback_host: 127.0.0.1
    callback_port: 0

ingestion:
  # APScheduler-style polling cadence for the watched input folder.
  poll_interval_seconds: 60
  # SHA-256 duplicate rejection per ADR-016.
  duplicate_rejection: sha256

rem:
  # REM-style overnight processing cadence per requirements §3.4 and
  # DQ-009. Default fixed schedule.
  enabled: true
  cron: "0 2 * * *"     # 02:00 local time
