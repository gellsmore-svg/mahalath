[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahalath"
version = "1.1.0"
description = "Self-sustaining multi-agent ontology builder with REM-style refinement."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "gellsmore-svg"},
]
dependencies = [
    "keturah>=0.1",  # LLM-interface manifest (build_manifest / to_mcp)
    "pymongo>=4.6",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]
# Route LLM calls through a Hoglah queue daemon (model_adapter = "hoglah").
hoglah = [
    "hoglah>=0.8.0",
]
# Route through Hoglah over a messaging broker (runtime.hoglah.transport).
hoglah-kafka = ["hoglah>=0.8.0", "confluent-kafka>=2.3"]
hoglah-rabbitmq = ["hoglah>=0.8.0", "pika>=1.3"]
hoglah-redis = ["hoglah>=0.8.0", "redis>=5.0"]
# Emit pipeline lifecycle events onto the family trace spine (galeed.enabled).
galeed = ["galeed>=0.1"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
mahalath = "mahalath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mahalath = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
