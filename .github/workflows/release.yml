name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist
          shopt -s nullglob
          wheels=(dist/*-py3-none-any.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one wheel and one sdist" >&2
            ls -l dist || true
            exit 1
          fi
          python -m venv /tmp/rel
          /tmp/rel/bin/pip install --upgrade pip
          /tmp/rel/bin/pip install "${wheels[0]}"
          /tmp/rel/bin/python -c "import mahalath; print(mahalath.__version__)"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Requires a Trusted Publisher on PyPI for this repo + release.yml
